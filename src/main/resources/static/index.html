
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SearchHUB</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #07080d;
      --cyan: #00d4c8;
      --muted: #4e5268;
      --muted-lt: #7a8099;
      --bar-bg: #0d0e18;
      --bar-border: #1c1e2e;
    }
    html, body {
      width: 100%; height: 100%;
      font-family: 'Sora', sans-serif;
      background: var(--bg);
      color: #fff;
      overflow: hidden;
    }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 60% 45% at 50% 38%, rgba(0,180,170,0.065) 0%, transparent 65%),
        radial-gradient(ellipse 40% 35% at 12% 72%, rgba(100,40,200,0.07) 0%, transparent 58%),
        radial-gradient(ellipse 35% 30% at 88% 15%, rgba(60,20,160,0.09) 0%, transparent 55%),
        radial-gradient(ellipse 28% 28% at 68% 78%, rgba(0,120,110,0.05) 0%, transparent 50%);
    }
    #stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

    /* Space objects — all SVG, all transparent */
    .obj { position: fixed; pointer-events: none; z-index: 1; overflow: visible; }
    .obj svg { overflow: visible; }

    /* POSITIONS — genuinely random scatter across all screen zones */
    .o1 { top: 6vh;   left: 4vw;   width: 160px; animation: a1 7s   ease-in-out infinite; }
    .o2 { top: 4vh;   right: 5vw;  width: 195px; animation: a2 10s  ease-in-out infinite; }
    .o3 { top: 44vh;  left: 1vw;   width: 90px;  animation: a3 8s   ease-in-out infinite 1.2s; }
    .o4 { top: 30vh;  right: 1vw;  width: 75px;  animation: a4 6s   ease-in-out infinite 0.5s; }
    .o5 { bottom: 16vh; right: 5vw; width: 125px; animation: a5 9s  ease-in-out infinite 2s; }
    .o6 { bottom: 10vh; left: 5vw;  width: 105px; animation: a6 6.5s ease-in-out infinite 0.4s; }
    .o7 { top: 22vh;  left: 22vw;  width: 58px;  animation: a7 13s  ease-in-out infinite 3s; }
    .o8 { bottom: 35vh; right: 25vw; width: 54px; animation: a8 3s  ease-in-out infinite; }
    .o9 { top: 60vh;  left: 30vw;  width: 36px;  animation: a8 2.6s ease-in-out infinite 0.9s; }
    .o10{ top: 16vh;  left: 57vw;  width: 26px;  animation: a8 4.1s ease-in-out infinite 1.5s; }
    .o11{ bottom: 22vh; left: 46vw; width: 20px; animation: a8 3.7s ease-in-out infinite 0.3s; }

    @keyframes a1 { 0%,100%{transform:translate(0,0) rotate(-4deg);}    50%{transform:translate(10px,-24px) rotate(3deg);} }
    @keyframes a2 { 0%,100%{transform:translate(0,0) rotate(-9deg);}    50%{transform:translate(-14px,-28px) rotate(-3deg);} }
    @keyframes a3 { 0%,100%{transform:translate(0,0) rotate(6deg);}     50%{transform:translate(12px,-18px) rotate(13deg);} }
    @keyframes a4 { 0%,100%{transform:translate(0,0) rotate(3deg);}     50%{transform:translate(-9px,-16px) rotate(-4deg);} }
    @keyframes a5 { 0%,100%{transform:translate(0,0) rotate(-6deg);}    50%{transform:translate(-8px,-20px) rotate(-1deg);} }
    @keyframes a6 { 0%,100%{transform:translate(0,0) rotate(4deg);}     50%{transform:translate(9px,-16px) rotate(-2deg);} }
    @keyframes a7 { 0%,100%{transform:translate(0,0) rotate(-22deg);}   50%{transform:translate(22px,-12px) rotate(-16deg);} }
    @keyframes a8 { 0%,100%{opacity:0.4; transform:scale(0.82);}        50%{opacity:1; transform:scale(1.22);} }

    /* Shell */
    .shell { position: relative; z-index: 2; width: 100vw; height: 100vh; display: flex; flex-direction: column; }
    nav { position: absolute; top: 24px; right: 38px; display: flex; gap: 30px; z-index: 10; }
    nav a { color: var(--muted-lt); font-size: 13.5px; font-weight: 500; text-decoration: none; letter-spacing: .02em; transition: color .2s; }
    nav a:hover { color: #fff; }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 72px; }
    .logo { font-size: clamp(60px,7.5vw,90px); font-weight: 800; letter-spacing: -0.035em; line-height: 1; margin-bottom: 40px; user-select: none; }
    .logo-search { color: #eef0f8; }
    .logo-hub { color: var(--cyan); text-shadow: 0 0 50px rgba(0,212,200,0.6), 0 0 100px rgba(0,180,170,0.3), 0 0 200px rgba(0,150,145,0.12); }
    .search-wrap { width: min(700px,90vw); margin-bottom: 18px; }
    .search-bar {
      display: flex; align-items: center; background: var(--bar-bg);
      border: 1px solid var(--bar-border); border-radius: 50px;
      padding: 5px 5px 5px 22px; gap: 10px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.02) inset;
      transition: border-color .25s, box-shadow .25s;
    }
    .search-bar:focus-within { border-color: rgba(0,212,200,0.32); box-shadow: 0 8px 40px rgba(0,0,0,0.6), 0 0 60px rgba(0,212,200,0.08); }
    .search-icon { color: var(--muted); flex-shrink: 0; display: flex; }
    .search-icon svg { width: 18px; height: 18px; }
    .search-bar input { flex: 1; background: transparent; border: none; outline: none; font-family: 'Sora',sans-serif; font-size: 15px; color: var(--muted-lt); }
    .search-bar input::placeholder { color: var(--muted); }
    .mic-btn { background: none; border: none; cursor: pointer; color: var(--muted); display: flex; padding: 5px; transition: color .2s; }
    .mic-btn:hover { color: #fff; }
    .mic-btn svg { width: 19px; height: 19px; }
    .ai-btn {
      display: flex; align-items: center; gap: 7px; background: transparent;
      border: 1.5px solid rgba(0,180,170,0.5); border-radius: 50px; padding: 9px 20px;
      color: var(--cyan); font-family: 'Sora',sans-serif; font-size: 13px; font-weight: 600;
      cursor: pointer; letter-spacing: .02em; white-space: nowrap; transition: all .25s;
    }
    .ai-btn:hover { background: rgba(0,212,200,0.09); border-color: var(--cyan); box-shadow: 0 0 28px rgba(0,212,200,0.18); }
    .action-btns { display: flex; gap: 12px; }
    .action-btn {
      background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.09);
      border-radius: 50px; padding: 11px 30px; color: #b0b5cc;
      font-family: 'Sora',sans-serif; font-size: 14px; font-weight: 500;
      cursor: pointer; transition: all .25s; backdrop-filter: blur(10px);
    }
    .action-btn:hover { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.18); color: #fff; }
    .bottom-strip {
      position: absolute; bottom: 0; left: 0; right: 0; padding: 13px 30px 14px;
      display: flex; flex-direction: column; gap: 8px;
      border-top: 1px solid rgba(255,255,255,0.04);
      background: rgba(7,8,13,0.9); backdrop-filter: blur(16px);
    }
    .explore-label { font-size: 12.5px; color: var(--muted); font-weight: 500; letter-spacing: .02em; }
    .footer-links { display: flex; align-items: center; justify-content: space-between; }
    .footer-left, .footer-right { display: flex; gap: 22px; }
    .footer-links a { font-size: 12px; color: var(--muted); text-decoration: none; font-weight: 500; transition: color .2s; }
    .footer-links a:hover { color: var(--muted-lt); }
  </style>
</head>
<body>
<canvas id="stars"></canvas>

<!-- ═══════════════════════════════════════════════════════
     OBJECT 1 — TEAL SAUCER UFO (top left)
     Classic flying saucer, glowing cyan rings, transparent bg
════════════════════════════════════════════════════════ -->
<div class="obj o1">
<svg viewBox="0 0 160 110" xmlns="http://www.w3.org/2000/svg" overflow="visible">
  <defs>
    <radialGradient id="d1" cx="40%" cy="32%" r="65%">
      <stop offset="0%"   stop-color="#90fff8"/>
      <stop offset="30%"  stop-color="#00d0c4"/>
      <stop offset="70%"  stop-color="#006860"/>
      <stop offset="100%" stop-color="#001e1c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="r1" cx="50%" cy="30%" r="50%">
      <stop offset="0%"   stop-color="#005550"/>
      <stop offset="100%" stop-color="#001a18" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="g1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="og1" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <!-- outer ambient glow — no fill rectangle, just ellipse -->
  <ellipse cx="80" cy="72" rx="70" ry="18" fill="#00c8c0" opacity="0.06" filter="url(#og1)"/>
  <!-- ring body -->
  <ellipse cx="80" cy="70" rx="65" ry="10" fill="url(#r1)"/>
  <!-- top glowing rim -->
  <ellipse cx="80" cy="67" rx="65" ry="10" fill="none" stroke="#00d4c8" stroke-width="1.8" opacity="0.95" filter="url(#g1)"/>
  <!-- inner rings -->
  <ellipse cx="80" cy="70" rx="44" ry="7"  fill="none" stroke="#00b8b2" stroke-width="1.1" opacity="0.55"/>
  <ellipse cx="80" cy="70" rx="24" ry="4"  fill="none" stroke="#00ccc6" stroke-width="0.9" opacity="0.45"/>
  <!-- dome -->
  <ellipse cx="80" cy="52" rx="30" ry="22" fill="url(#d1)"/>
  <!-- dome interior shading — colored, not black -->
  <ellipse cx="80" cy="60" rx="28" ry="12" fill="#003330" opacity="0.4"/>
  <!-- dome windows -->
  <ellipse cx="68" cy="55" rx="5" ry="3.5" fill="#40ffe8" opacity="0.25"/>
  <ellipse cx="80" cy="52" rx="5" ry="3.5" fill="#40ffe8" opacity="0.2"/>
  <ellipse cx="92" cy="55" rx="5" ry="3.5" fill="#40ffe8" opacity="0.25"/>
  <!-- dome shine -->
  <ellipse cx="68" cy="44" rx="10" ry="6" fill="rgba(200,255,252,0.22)" transform="rotate(-18 68 44)"/>
  <!-- antenna -->
  <line x1="80" y1="30" x2="80" y2="38" stroke="#00c0b8" stroke-width="1.4" opacity="0.75"/>
  <circle cx="80" cy="29" r="2.2" fill="#00ffee" opacity="0.9" filter="url(#g1)"/>
  <!-- ring light dots -->
  <circle cx="24"  cy="69" r="2.6" fill="#00ffee" opacity="0.95" filter="url(#g1)"/>
  <circle cx="44"  cy="76" r="2"   fill="#00eee4" opacity="0.7"/>
  <circle cx="64"  cy="79" r="2.4" fill="#00ffee" opacity="0.88" filter="url(#g1)"/>
  <circle cx="80"  cy="80" r="2.8" fill="#00ffee" opacity="0.98" filter="url(#g1)"/>
  <circle cx="96"  cy="79" r="2.4" fill="#00ffee" opacity="0.88" filter="url(#g1)"/>
  <circle cx="116" cy="76" r="2"   fill="#00eee4" opacity="0.7"/>
  <circle cx="136" cy="69" r="2.6" fill="#00ffee" opacity="0.95" filter="url(#g1)"/>
  <!-- beam -->
  <ellipse cx="80" cy="86" rx="16" ry="4" fill="#00d4c8" opacity="0.12" filter="url(#g1)"/>
</svg>
</div>

<!-- ═══════════════════════════════════════════════════════
     OBJECT 2 — PURPLE SATURN (top right)
     Large ringed gas giant, deep violet, no dark rectangles
════════════════════════════════════════════════════════ -->
<div class="obj o2">
<svg viewBox="0 0 195 150" xmlns="http://www.w3.org/2000/svg" overflow="visible">
  <defs>
    <radialGradient id="p2" cx="36%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#d090ff"/>
      <stop offset="22%"  stop-color="#9050e0"/>
      <stop offset="52%"  stop-color="#5820b0"/>
      <stop offset="78%"  stop-color="#300878"/>
      <stop offset="100%" stop-color="#120230" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pb2" cx="50%" cy="50%" r="50%">
      <stop offset="60%"  stop-color="#5820b0" stop-opacity="0"/>
      <stop offset="100%" stop-color="#9050e0" stop-opacity="0.18"/>
    </radialGradient>
    <filter id="og2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="g2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cp2"><circle cx="97" cy="74" r="46"/></clipPath>
  </defs>
  <!-- glow aura -->
  <circle cx="97" cy="74" r="52" fill="#7030c0" opacity="0.07" filter="url(#og2)"/>
  <!-- ring back half -->
  <ellipse cx="97" cy="86" rx="90" ry="17" fill="none" stroke="#7030c0" stroke-width="9" opacity="0.4"/>
  <ellipse cx="97" cy="86" rx="76" ry="13" fill="none" stroke="#9040e0" stroke-width="4" opacity="0.25"/>
  <!-- planet body -->
  <circle cx="97" cy="74" r="46" fill="url(#p2)"/>
  <!-- atmospheric glow rim -->
  <circle cx="97" cy="74" r="46" fill="url(#pb2)"/>
  <!-- surface bands — clipped to planet -->
  <g clip-path="url(#cp2)">
    <ellipse cx="97" cy="66" rx="38" ry="5"   fill="#c080ff" opacity="0.08"/>
    <ellipse cx="97" cy="75" rx="42" ry="4"   fill="#300878" opacity="0.18"/>
    <ellipse cx="97" cy="83" rx="32" ry="3"   fill="#c080ff" opacity="0.07"/>
    <ellipse cx="97" cy="90" rx="24" ry="2.5" fill="#300878" opacity="0.14"/>
    <!-- swirl detail -->
    <ellipse cx="78" cy="70" rx="12" ry="5" fill="#a060e8" opacity="0.1" transform="rotate(-12 78 70)"/>
  </g>
  <!-- ring front half -->
  <path d="M 7 90 Q 97 112 187 90" stroke="#b060ff" stroke-width="10" fill="none" opacity="0.55" stroke-linecap="round"/>
  <path d="M 18 94 Q 97 113 176 94" stroke="#8040c8" stroke-width="5"  fill="none" opacity="0.38" stroke-linecap="round"/>
  <!-- ring shimmer highlights -->
  <ellipse cx="28"  cy="91" rx="8" ry="2.5" fill="#d090ff" opacity="0.28" transform="rotate(-5 28 91)"/>
  <ellipse cx="168" cy="91" rx="8" ry="2.5" fill="#d090ff" opacity="0.22" transform="rotate(5 168 91)"/>
  <!-- shine -->
  <ellipse cx="78" cy="57" rx="15" ry="9" fill="rgba(255,220,255,0.14)" transform="rotate(-22 78 57)"/>
  <ellipse cx="82" cy="53" rx="6"  ry="3.5" fill="rgba(255,255,255,0.1)" transform="rotate(-22 82 53)"/>
</svg>
</div>

<!-- ═══════════════════════════════════════════════════════
     OBJECT 3 — MARS / RED ROCKY PLANET (mid left)
     No rings. Fiery orange-red, craters, transparent bg
════════════════════════════════════════════════════════ -->
<div class="obj o3">
<svg viewBox="0 0 90 90" xmlns="http://www.w3.org/2000/svg" overflow="visible">
  <defs>
    <radialGradient id="p3" cx="34%" cy="28%" r="72%">
      <stop offset="0%"   stop-color="#ff9060"/>
      <stop offset="28%"  stop-color="#e04818"/>
      <stop offset="62%"  stop-color="#a02010"/>
      <stop offset="88%"  stop-color="#500808"/>
      <stop offset="100%" stop-color="#200202" stop-opacity="0"/>
    </radialGradient>
    <filter id="og3" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="cp3"><circle cx="45" cy="45" r="32"/></clipPath>
  </defs>
  <circle cx="45" cy="45" r="36" fill="#e04010" opacity="0.08" filter="url(#og3)"/>
  <circle cx="45" cy="45" r="32" fill="url(#p3)"/>
  <g clip-path="url(#cp3)">
    <ellipse cx="40" cy="42" rx="10" ry="5.5" fill="#600a00" opacity="0.22" transform="rotate(-12 40 42)"/>
    <ellipse cx="55" cy="52" rx="7"  ry="3.5" fill="#600a00" opacity="0.16" transform="rotate(6 55 52)"/>
    <ellipse cx="35" cy="54" rx="5"  ry="2.8" fill="#ff7040" opacity="0.14"/>
    <!-- craters -->
    <circle cx="52" cy="38" r="5"   fill="#500800" opacity="0.25"/>
    <circle cx="52" cy="38" r="3.5" fill="#400600" opacity="0.2"/>
    <circle cx="36" cy="52" r="3.2" fill="#500800" opacity="0.2"/>
    <circle cx="36" cy="52" r="2"   fill="#400600" opacity="0.15"/>
    <!-- polar ice cap hint -->
    <ellipse cx="45" cy="18" rx="6" ry="3" fill="rgba(255,240,230,0.18)" clip-path="url(#cp3)"/>
  </g>
  <!-- atmospheric rim -->
  <circle cx="45" cy="45" r="32" fill="none" stroke="#ff6030" stroke-width="2.5" opacity="0.22"/>
  <!-- shine -->
  <ellipse cx="34" cy="33" rx="10" ry="6.5" fill="rgba(255,180,130,0.2)" transform="rotate(-20 34 33)"/>
</svg>
</div>

<!-- ═══════════════════════════════════════════════════════
     OBJECT 4 — RETRO CHROME DISC UFO (mid right)
     Different from o1: silver metallic, orange lights, domed flat
════════════════════════════════════════════════════════ -->
<div class="obj o4">
<svg viewBox="0 0 75 52" xmlns="http://www.w3.org/2000/svg" overflow="visible">
  <defs>
    <linearGradient id="r4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#b0c8d8"/>
      <stop offset="45%"  stop-color="#506878"/>
      <stop offset="100%" stop-color="#1a2830" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="d4" cx="42%" cy="32%" r="62%">
      <stop offset="0%"   stop-color="#d0f0ff"/>
      <stop offset="38%"  stop-color="#5090b8"/>
      <stop offset="75%"  stop-color="#1c3c58"/>
      <stop offset="100%" stop-color="#081420" stop-opacity="0"/>
    </radialGradient>
    <filter id="g4" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- flat metallic ring -->
  <ellipse cx="37" cy="33" rx="35" ry="8" fill="url(#r4)"/>
  <ellipse cx="37" cy="31" rx="35" ry="8" fill="none" stroke="#c0d8e8" stroke-width="1" opacity="0.65"/>
  <ellipse cx="37" cy="34" rx="28" ry="6" fill="none" stroke="#607888" stroke-width="0.7" opacity="0.4"/>
  <!-- flat dome — very shallow -->
  <ellipse cx="37" cy="26" rx="20" ry="12" fill="url(#d4)"/>
  <!-- dome rim stripe -->
  <ellipse cx="37" cy="26" rx="20" ry="12" fill="none" stroke="#80b0c8" stroke-width="0.8" opacity="0.5"/>
  <!-- dome shine -->
  <ellipse cx="30" cy="20" rx="6" ry="3.5" fill="rgba(220,248,255,0.28)" transform="rotate(-14 30 20)"/>
  <!-- orange/red lights — different color from o1's cyan -->
  <circle cx="11"  cy="33" r="2.2" fill="#ff7040" opacity="0.9" filter="url(#g4)"/>
  <circle cx="22"  cy="38" r="1.6" fill="#ff9060" opacity="0.7"/>
  <circle cx="37"  cy="40" r="2.4" fill="#ff7040" opacity="0.92" filter="url(#g4)"/>
  <circle cx="52"  cy="38" r="1.6" fill="#ff9060" opacity="0.7"/>
  <circle cx="63"  cy="33" r="2.2" fill="#ff7040" opacity="0.9" filter="url(#g4)"/>
  <!-- bottom glow orange -->
  <ellipse cx="37" cy="42" rx="14" ry="3.5" fill="#ff6020" opacity="0.09" filter="url(#g4)"/>
</svg>
</div>

<!-- ═══════════════════════════════════════════════════════
     OBJECT 5 — ICE NEPTUNE PLANET (bottom right)
     Blue gas giant, faint partial ring, storm spot
════════════════════════════════════════════════════════ -->
<div class="obj o5">
<svg viewBox="0 0 125 125" xmlns="http://www.w3.org/2000/svg" overflow="visible">
  <defs>
    <radialGradient id="p5" cx="33%" cy="27%" r="74%">
      <stop offset="0%"   stop-color="#90e0ff"/>
      <stop offset="24%"  stop-color="#2098e8"/>
      <stop offset="54%"  stop-color="#0848b0"/>
      <stop offset="80%"  stop-color="#022268"/>
      <stop offset="100%" stop-color="#000e30" stop-opacity="0"/>
    </radialGradient>
    <filter id="og5" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="cp5"><circle cx="62" cy="62" r="44"/></clipPath>
  </defs>
  <circle cx="62" cy="62" r="50" fill="#1060d0" opacity="0.07" filter="url(#og5)"/>
  <!-- partial thin ring -->
  <ellipse cx="62" cy="62" rx="56" ry="9" fill="none" stroke="#4090d0" stroke-width="2" stroke-dasharray="80 100" stroke-dashoffset="20" opacity="0.28"/>
  <circle  cx="62" cy="62" r="44" fill="url(#p5)"/>
  <g clip-path="url(#cp5)">
    <ellipse cx="62" cy="53" rx="36" ry="5"   fill="#80d0ff" opacity="0.1"/>
    <ellipse cx="62" cy="63" rx="40" ry="4.5" fill="#022268" opacity="0.22"/>
    <ellipse cx="62" cy="72" rx="30" ry="3.5" fill="#80d0ff" opacity="0.08"/>
    <ellipse cx="62" cy="80" rx="20" ry="2.5" fill="#0848b0" opacity="0.15"/>
    <!-- storm oval — characteristic Neptune feature -->
    <ellipse cx="76" cy="58" rx="9" ry="5.5" fill="#ffffff" opacity="0.09" transform="rotate(-10 76 58)"/>
    <ellipse cx="76" cy="58" rx="5" ry="3"   fill="#ffffff" opacity="0.07" transform="rotate(-10 76 58)"/>
  </g>
  <!-- atmosphere rim -->
  <circle cx="62" cy="62" r="44" fill="none" stroke="#60b0ff" stroke-width="3" opacity="0.18"/>

<script>
(function(){
  const canvas=document.getElementById('stars'),ctx=canvas.getContext('2d');
  let stars=[];
  function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}
  function init(){
    stars=Array.from({length:260},()=>({
      x:Math.random()*canvas.width, y:Math.random()*canvas.height,
      r:Math.random()*1.4+0.15,
      phase:Math.random()*Math.PI*2, speed:Math.random()*0.011+0.003,
      flare:Math.random()<0.1, fp:Math.random()*Math.PI*2, fs:Math.random()*0.022+0.007,
      color:Math.random()<0.08?'rgba(0,210,200,':
            Math.random()<0.06?'rgba(180,120,255,':
            Math.random()<0.04?'rgba(255,200,100,':
            'rgba(200,210,235,'
    }));
  }
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    stars.forEach(s=>{
      s.phase+=s.speed; s.fp+=s.fs;
      const a=Math.sin(s.phase)*0.42+0.54;
      let r=s.r;
      if(s.flare){
        const fv=Math.sin(s.fp);
        if(fv>0.85){
          r+=fv*1.5;
          const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,r*6);
          g.addColorStop(0,s.color+'0.45)'); g.addColorStop(1,s.color+'0)');
          ctx.beginPath();ctx.arc(s.x,s.y,r*6,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
        }
      }
      ctx.beginPath();ctx.arc(s.x,s.y,Math.max(0.1,r),0,Math.PI*2);
      ctx.fillStyle=s.color+Math.min(1,a)+')';ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  resize();init();draw();
  window.addEventListener('resize',()=>{resize();init();});
})();
</script>
